# Site do Meu Bar no NGINX DO SERVIDOR (modo DEPLOY_MODO=proxy).
# Configuração única, feita uma vez no servidor:
#
#   sudo cp nginx-servidor-meubar.conf /etc/nginx/sites-available/meubar
#   sudo ln -s /etc/nginx/sites-available/meubar /etc/nginx/sites-enabled/meubar
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS:
#   - Atrás da Cloudflare com proxy ligado (nuvem laranja): o HTTPS é da Cloudflare,
#     este arquivo fica só na porta 80. Não rode certbot.
#   - Sem Cloudflare: sudo certbot --nginx -d <domínio>  (exige a porta 443 livre no servidor)
#
# Ajuste server_name e a porta (APP_PORT, padrão 3080) se forem diferentes.

server {
  listen 80;
  listen [::]:80;
  server_name meubar.fiiinfamilia.com.br;

  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
