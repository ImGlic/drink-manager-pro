# Produção: Nginx (na imagem do app) servindo HTTP/HTTPS + certbot (Let's Encrypt).
# A pipeline copia este arquivo para ~/meu-bar no servidor e gera o .env.
# nome fixo do projeto: evita conflito com outros apps que também tenham uma pasta "deploy"
name: meu-bar

services:
  web:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      DOMAIN: ${DOMAIN}
      ENABLE_HTTPS: "true"
      FORCE_HTTPS: "true"
      CERT_RELOAD_INTERVAL: "6h"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - nginx-certs:/etc/nginx/certs

  # Renova o certificado automaticamente (a emissão inicial é feita pelo atualizar.sh)
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  letsencrypt:
  certbot-www:
  nginx-certs:
