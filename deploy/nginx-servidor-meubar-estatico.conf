# Meu Bar servido como SITE ESTÁTICO pelo NGINX DO SERVIDOR (sem container rodando).
# Os arquivos são publicados em /var/www/meubar por deploy/publicar-estatico.sh.
#
# Configuração única no servidor:
#   sudo cp nginx-servidor-meubar-estatico.conf /etc/nginx/sites-available/meubar
#   sudo ln -sf /etc/nginx/sites-available/meubar /etc/nginx/sites-enabled/meubar
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: entregue pela Cloudflare (proxy ligado / nuvem laranja). Este arquivo fica só na porta 80.

server {
  listen 80;
  listen [::]:80;
  server_name meubar.fiiinfamilia.com.br;

  root /var/www/meubar;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # câmera (leitura de código) e USB/Serial/Bluetooth (impressora)
  add_header Permissions-Policy "camera=(self), usb=(self), serial=(self), bluetooth=(self), microphone=()" always;

  # arquivos com hash no nome: cache longo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), usb=(self), serial=(self), bluetooth=(self), microphone=()" always;
    try_files $uri =404;
  }

  # configuração e página principal: nunca em cache
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA: rotas do React Router caem no index.html
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), usb=(self), serial=(self), bluetooth=(self), microphone=()" always;
    try_files $uri $uri/ /index.html;
  }
}
