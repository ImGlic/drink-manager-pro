server_tokens off;

# Cache: assets com hash = 1 ano; index.html e config.js nunca em cache
map $uri $cache_control {
  ~^/assets/   "public, max-age=31536000, immutable";
  /config.js   "no-store";
  default      "no-cache";
}

server {
  listen 80;
  server_name _;
  include /etc/nginx/conf.d/app.inc;
}

# BEGIN HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  include /etc/nginx/conf.d/app.inc;
}
# END HTTPS
