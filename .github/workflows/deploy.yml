name: Deploy

# Roda em todo push na main (ou manualmente: Actions > Deploy > Run workflow).
#
# Configure no GitHub (Settings > Secrets and variables > Actions):
#   Variables:
#     DEPLOY_SUPABASE=true        liga migrations + Edge Functions
#     DEPLOY_SERVER=true          liga o deploy no servidor
#     SUPABASE_PROJECT_REF        ex.: lbzfaurczxwigkrkuqet
#     SUPABASE_URL                ex.: https://lbzfaurczxwigkrkuqet.supabase.co
#     SUPABASE_PUBLISHABLE_KEY    chave sb_publishable_... (é pública)
#     DOMAIN                      ex.: pdv.seudominio.com.br (DNS apontando para o servidor)
#   Secrets:
#     SUPABASE_ACCESS_TOKEN       supabase.com > Account > Access Tokens
#     SUPABASE_DB_PASSWORD        Project Settings > Database
#     SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (chave privada), SERVER_PORT (opcional)
#
# Crie o environment "production" (Settings > Environments) para exigir aprovação manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publicar imagem (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.nome.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: nome
        # o GHCR exige nome em minúsculas
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nome.outputs.image }}:${{ github.sha }}
            ${{ steps.nome.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  supabase:
    name: Supabase (migrations + funções)
    needs: ci
    if: vars.DEPLOY_SUPABASE == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Migrations
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions
        run: supabase functions deploy gerenciar-usuarios certificado-a1 nfce --project-ref "$PROJECT_REF" --use-api

  server:
    name: Servidor (docker compose)
    needs: [image, supabase]
    # roda também quando o job do Supabase estiver desligado (skipped)
    if: >-
      always() && vars.DEPLOY_SERVER == 'true' &&
      needs.image.result == 'success' &&
      (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copiar arquivos de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/atualizar.sh
          target: ~/meu-bar
          strip_components: 1
      - name: Atualizar containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          DOMAIN: ${{ vars.DOMAIN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE,IMAGE_TAG,DOMAIN,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,GHCR_USER,GHCR_TOKEN
          script: bash ~/meu-bar/atualizar.sh
