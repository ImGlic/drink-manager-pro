name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # na main o CI roda dentro do workflow de deploy
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4
      - working-directory: supabase/functions
        run: deno check gerenciar-usuarios/index.ts certificado-a1/index.ts nfce/index.ts

  migrations:
    name: Migrations (Postgres descartável)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      # sobe só o Postgres do Supabase e aplica todas as migrations do zero
      - run: supabase db start
      - run: supabase stop --no-backup

  docker:
    name: Imagem Docker (build de teste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
